name: Package smoke

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "electron-builder.json5"
      - "electron/**"
      - "scripts/smoke-packaged.mjs"
      - ".github/workflows/package-smoke.yml"

permissions:
  contents: read

jobs:
  package-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test --run

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build unpacked app
        run: pnpm pack:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm smoke:packaged

      - name: Smoke (macOS / Windows)
        if: runner.os != 'Linux'
        run: pnpm smoke:packaged

      - name: Upload unpacked app on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jin-${{ matrix.os }}-failure
          path: release/**/logs/**
          if-no-files-found: ignore
          retention-days: 7
